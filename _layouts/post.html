---
layout: default
---
<article>
  <header class="mb-8">
    <p class="text-xs tracking-widest uppercase opacity-50">
      {{ page.date | date: "%-d %b %Y" }}{% if page.author %} · {{ page.author }}{% endif %}
    </p>
    <h1 class="mt-2 text-3xl font-semibold tracking-tight">{{ page.title }}</h1>
    {%- if page.tags and page.tags.size > 0 %}
    <ul class="mt-4 flex flex-wrap gap-2 text-xs">
      {%- for tag in page.tags %}
      <li class="rounded-full border border-black/10 px-3 py-1 opacity-60 dark:border-white/15">{{ tag }}</li>
      {%- endfor %}
    </ul>
    {%- endif %}
  </header>
  <div class="prose-content">{{ content }}</div>
</article>
