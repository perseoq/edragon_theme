<header class="border-b border-black/10 dark:border-white/15">
  <div class="mx-auto flex w-full max-w-6xl items-start justify-between gap-4 px-4 pt-8 pb-5">
    <div class="min-w-0">
      <a href="{{ '/' | relative_url }}" class="text-2xl font-semibold tracking-tight text-inherit no-underline">{{ site.title }}</a>
    </div>
    <button
      type="button"
      data-theme-toggle
      aria-label="Alternar modo claro y oscuro"
      class="shrink-0 rounded-full border border-black/15 p-2 leading-none transition hover:bg-black/5 dark:border-white/20 dark:hover:bg-white/10"
    >
      <svg class="dark:hidden" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="hidden dark:block" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
    </button>
  </div>
  {%- assign menu = site.pages | where: "path", "nav/menu.md" | first %}
  {%- if menu and menu.content and menu.content != empty %}
  <nav class="site-nav mx-auto w-full max-w-6xl px-4 pb-6" aria-label="Principal">
    {{ menu.content | markdownify }}
  </nav>
  {%- endif %}
</header>
