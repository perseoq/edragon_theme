<article class="border-b border-black/10 py-8 first:pt-0 last:border-0 dark:border-white/10">
  <p class="text-xs tracking-widest uppercase opacity-50">{{ post.date | date: "%-d %b %Y" }}</p>
  <h2 class="mt-2 text-xl font-semibold tracking-tight">
    <a href="{{ post.url | relative_url }}" class="text-inherit no-underline hover:underline hover:underline-offset-4">{{ post.title }}</a>
  </h2>
  <p class="mt-2 text-sm leading-relaxed opacity-70">{{ post.excerpt | strip_html | truncatewords: 40 }}</p>
  <a href="{{ post.url | relative_url }}" class="mt-3 inline-block text-sm no-underline opacity-70 transition hover:opacity-100">Leer más</a>
</article>
